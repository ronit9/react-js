<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>checkout</title>
    <link
      rel="icon"
      href="./src/img/file_000000004cf861fdadd881970e0079ee.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="src/check.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div
        class="container d-flex justify-content-between align-items-center w-100"
      >
        <ul class="navbar-nav flex-row">
          <li class="nav-item me-3">
            <a class="nav-link active" href="index.html">Home</a>
          </li>
          <li class="nav-item me-3">
            <a class="nav-link" href="#">Shop</a>
          </li>
          <li class="nav-item me-3">
            <a class="nav-link" href="#">Product</a>
          </li>
        </ul>

        <a class="navbar-brand mx-3" href="#">
          <img
            src="./src/img/file_000000004cf861fdadd881970e0079ee.png"
            alt="ShopEase Logo"
          />
        </a>

        <ul class="navbar-nav flex-row">
          <li class="nav-item me-3">
            <a class="nav-link" href="#">Contact</a>
          </li>
          <li class="nav-item mx-3">
            <a class="custom-cart" href="cart.html">
              <i class="bi bi-cart"></i>
            </a>
          </li>
          <li class="nav-item profile-dropdown mx-3" id="profileDropdown">
            <img
              src="https://i.pravatar.cc/300"
              alt="Profile"
              class="profile-image"
              onclick="toggleDropdown()"
            />
            <div class="dropdown-menu" id="dropdownMenu">
              <span id="username" class="p-2"></span>
              <a href="#" id="statusid" class="p-2" onclick="logout()"></a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
    <section class="rec p-5">
      <div class="container">
        <h1 class="text-center">Proceed to Checkout</h1>
        <div class="row">
          <div class="col-7">
            <form class="row g-3">
              <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail4" />
              </div>
              <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="inputPassword4"
                />
              </div>
              <div class="col-12">
                <label for="inputAddress" class="form-label">Address</label>
                <input
                  type="text"
                  class="form-control"
                  id="inputAddress"
                  placeholder="1234 Main St"
                />
              </div>
              <div class="col-12">
                <label for="inputAddress2" class="form-label">Address 2</label>
                <input
                  type="text"
                  class="form-control"
                  id="inputAddress2"
                  placeholder="Apartment, studio, or floor"
                />
              </div>
              <div class="col-md-6">
                <label for="inputCity" class="form-label">City</label>
                <input type="text" class="form-control" id="inputCity" />
              </div>
              <div class="col-md-3">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select">
                  <option>Surat</option>
                  <option>Ahmedabad</option>
                  <option>Vadodara</option>
                  <option>Rajkot</option>
                  <option>Bhavnagar</option>
                  <option>Jamnagar</option>
                  <option>Morbi</option>
                  <option>Gandhinagar</option>
                  <option>Bharuch</option>
                  <option>Nadiad</option>
                  <option>Anand</option>
                  <option>Kheda</option>
                  <option>Panchmahal</option>
                  <option>Dahod</option>
                  <option>Mahisagar</option>
                  <option>Aravalli</option>
                  <option>Banaskantha</option>
                  <option>Patna</option>
                  <option>Sabarkantha</option>
                  <option>Kutch</option>
                  <option>Amreli</option>
                  <option>Bhuj</option>
                  <option>Porbandar</option>
                  <option>Junagadh</option>
                  <option>Gir Somnath</option>
                  <option>Botad</option>
                  <option>Chhota Udepur</option>
                  <option>Devbhoomi Dwarka</option>
                  <option>Maharashtra</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="inputZip" class="form-label">Zip</label>
                <input type="text" class="form-control" id="inputZip" />
              </div>

              <div class="col-12">
                <h2>Payment Method</h2>
                <select class="col-6">
                  <option>Credit / Debit Card</option>
                  <option>UPI (GPay, PhonePe, etc.)</option>
                  <option>Cash on Delivery</option>
                </select>

                <div class="col-12">
                  <button id="addToCart" class="cartBtn mt-2">
                    <svg
                      class="cart"
                      fill="white"
                      viewBox="0 0 576 512"
                      height="1em"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"
                      />
                    </svg>
                    ADD TO CART
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      height="1em"
                      viewBox="0 0 640 512"
                      class="product"
                    >
                      <path
                        d="M211.8 0c7.8 0 14.3 5.7 16.7 13.2C240.8 51.9 277.1 80 320 80s79.2-28.1 91.5-66.8C413.9 5.7 420.4 0 428.2 0h12.6c22.5 0 44.2 7.9 61.5 22.3L628.5 127.4c6.6 5.5 10.7 13.5 11.4 22.1s-2.1 17.1-7.8 23.6l-56 64c-11.4 13.1-31.2 14.6-44.6 3.5L480 197.7V448c0 35.3-28.7 64-64 64H224c-35.3 0-64-28.7-64-64V197.7l-51.5 42.9c-13.3 11.1-33.1 9.6-44.6-3.5l-56-64c-5.7-6.5-8.5-15-7.8-23.6s4.8-16.6 11.4-22.1L137.7 22.3C155 7.9 176.7 0 199.2 0h12.6z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </form>
          </div>
          <div class="col-5">
            <div class="order-summary">
              <h2>Order Summary</h2>
              <div class="item">
                <span>Product 1</span>
                <span>₹599</span>
              </div>
              <div class="item">
                <span>Product 2</span>
                <span>₹999</span>
              </div>
              <hr />
              <div class="item">
                <strong>Subtotal</strong>
                <strong>₹1598</strong>
              </div>
              <div class="item">
                <span>Shipping</span>
                <span>₹40</span>
              </div>
              <div class="item total">
                <strong>Total</strong>
                <strong>₹1638</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="src/js/checkout.js"></script>
  </body>
</html>
